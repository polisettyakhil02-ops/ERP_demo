name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: [self-hosted, frontend-runner]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Build
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"
        run: |
          npm ci
          npm run build

      - name: Deploy dist to web root
        run: |
          cp -r dist/* /var/www/html/
